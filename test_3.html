<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="width: 450px; margin: 20px auto; border: 2px solid #000; padding: 20px 25px; font-family: Arial, sans-serif; box-sizing: border-box; background-color: #fff;">
        <h2 style="text-align: center; color: #0f1361; margin-top: 0; margin-bottom: 20px; font-size: 22px;">Student Registration Form</h2>
        <form>
            <!-- Full Name -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Full Name</label>
                <input type="text" placeholder="Enter Full Name" style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box; background-color: #ffffea;">
            </div>

            <!-- Email -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email</label>
                <input type="email" placeholder="Enter Email" style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box;">
            </div>

            <!-- Password -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Password</label>
                <input type="password" style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box;">
            </div>

            <!-- Date of Birth -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Date of Birth</label>
                <input type="date" style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box;">
            </div>

            <!-- Age -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Age</label>
                <input type="number" style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box;">
            </div>

            <!-- Gender -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Gender</label>
                <label style="font-weight: normal; margin-right: 15px;"><input type="radio" name="gender" value="male"> Male</label>
                <label style="font-weight: normal; margin-right: 15px;"><input type="radio" name="gender" value="female"> Female</label>
            </div>

            <!-- Course -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Course</label>
                <select style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box;">
                    <option value="">Select Course</option>
                    <option value="cs">Computer Science</option>
                    <option value="it">Information Technology</option>
                </select>
            </div>

            <!-- Subjects -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Subjects</label>
                <label style="font-weight: normal; margin-right: 12px;"><input type="checkbox" value="html"> HTML</label>
                <label style="font-weight: normal; margin-right: 12px;"><input type="checkbox" value="css"> CSS</label>
                <label style="font-weight: normal; margin-right: 12px;"><input type="checkbox" value="js"> JavaScript</label>
                <label style="font-weight: normal;"><input type="checkbox" value="php"> PHP</label> 
            </div>

            <!-- Profile Photo -->
                <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Profile Photo</label>
            <input type="file">
            </div>

            <!-- Favourite Color -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Favourite Color</label>
                <input type="color" style="width: 100%; height: 30px; border: 1px solid #767676; padding: 2px; box-sizing: border-box;">
            </div>

            <!-- Website -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Website</label>
                <input type="url" placeholder="https://example.com" style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box;">
            </div>

            <!-- Search -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Search</label>
                <input type="search" placeholder="Search" style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box;">
            </div>

            <!-- Feedback -->
            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Feedback</label>
                <textarea rows="4" style="width: 100%; padding: 6px 8px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box; resize: vertical;"></textarea>
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Submit" style="width: 100%; background-color: #388e3c; color: white; border: none; padding: 10px; font-size: 15px; font-weight: bold; border-radius: 3px; cursor: pointer; margin-bottom: 10px;">

            <!-- Reset Button -->
            <input type="reset" value="Reset" style="width: 100%; background-color: #d9381e; color: white; border: none; padding: 10px; font-size: 15px; font-weight: bold; border-radius: 3px; cursor: pointer;">
        </form>
    </div>
</body>
</html>
